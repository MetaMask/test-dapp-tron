name: Publish docs to GitHub Pages

on:
  workflow_call:
    inputs:
      destination_dir:
        required: true
        type: string

jobs:
  publish-docs-to-gh-pages:
    name: Publish docs to GitHub Pages
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Ensure `destination_dir` is not empty
        if: ${{ inputs.destination_dir == '' }}
        run: exit 1
      - name: Get access token
        id: get-token
        uses: MetaMask/github-tools/.github/actions/get-token@88836cf1473f73a64848a809cf89e616ed6ed692 # v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: write
        continue-on-error: true
      - name: Checkout and setup environment
        if: ${{ steps.get-token.outcome == 'success' }}
        uses: MetaMask/action-checkout-and-setup@v1
        with:
          is-high-risk-environment: true
      - name: Update `package.json` `homepage` field
        if: ${{ steps.get-token.outcome == 'success' }}
        run: |
          sed -i 's/"homepage": ".*"/"homepage": "https:\/\/metamask.github.io\/test-dapp-tron\/${{ inputs.destination_dir }}"/' package.json
          # Command for Linux (macOS and Windows use different `sed` syntax)
          sed -i "s|base: '.*'|base: '/test-dapp-tron/${{ inputs.destination_dir }}'|" vite.config.ts
      - name: Run build script
        if: ${{ steps.get-token.outcome == 'success' }}
        run: yarn build
      - name: Deploy to `${{ inputs.destination_dir }}` directory of `gh-pages` branch
        if: ${{ steps.get-token.outcome == 'success' }}
        uses: peaceiris/actions-gh-pages@de7ea6f8efb354206b205ef54722213d99067935
        with:
          # A policy must be registered for this repo and workflow
          # within the Token Exchange Service.
          personal_token: ${{ steps.get-token.outputs.token }}
          publish_dir: ./dist
          destination_dir: ${{ inputs.destination_dir }}
      - name: Show warning if the get-token step failed
        if: ${{ steps.get-token.outcome == 'failure' }}
        run: |
          echo "::warning::The docs publishing workflow failed because the required token could not be obtained. If you want to publish docs for this repo, you'll need to add a policy to the Token Exchange Service."
